name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. .NET 환경 세팅
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 3. 패키지 빌드 및 압축 (Pack)
        run: dotnet pack ./AuthLibrary/AuthLibrary.csproj -c Release

      - name: 4. NuGet 임시 API 키 발급 (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: KimBurnJun

      - name: 5. NuGet 푸시
        run: dotnet nuget push ./AuthLibrary/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
