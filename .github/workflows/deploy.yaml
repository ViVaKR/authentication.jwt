name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # 🎯 v1.0.0 같은 버전 태그를 붙여서 push할 때만 벼락같이 작동

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # 🛡️ 누겟 마당에 '임시 1회용 마패'를 요청하는 특권!
      contents: read

    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. .NET 환경 세팅
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # 전하의 프로젝트 닷넷 버전에 맞춤

      - name: 3. 패키지 빌드 및 압축 (Pack)
        run: dotnet pack -c Release

      - name: 4. 누겟 마당으로 임시 마패 자동 출두!
        run: dotnet nuget push ./bin/Release/*.nupkg --source https://nuget.org --skip-duplicate
